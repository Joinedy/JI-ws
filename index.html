<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>教育主题静态网页</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f6fa;
      color: #333;
    }
    header {
      background: #4a90e2;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .hero {
      background: white;
      padding: 60px 20px;
      text-align: center;
    }
    .hero h1 {
      margin-bottom: 10px;
      font-size: 36px;
    }
    .section {
      padding: 40px 20px;
      max-width: 900px;
      margin: auto;
    }
    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }
    footer {
      text-align: center;
      padding: 20px;
      background: #ddd;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h2>未来教育中心</h2>
    <p>让学习更简单 · 更有趣 · 更有效</p>
  </header>

  <div class="hero">
    <h1>欢迎来到未来教育</h1>
    <p>我们致力于打造开放、互动、创新的学习平台，为每一位学习者提供优质教育内容。</p>
  </div>

  <div class="section">
    <div class="card">
      <h3>🌱 启蒙教育</h3>
      <p>通过寓教于乐的方式，让孩子在游戏中学习语言、数学与逻辑思维，培养良好的学习兴趣。</p>
    </div>

    <div class="card">
      <h3>📘 基础知识课程</h3>
      <p>覆盖语文、数学、科学、历史等科目，结合丰富多样的教学方式，提升学生的综合能力。</p>
    </div>

    <div class="card">
      <h3>💻 在线互动课堂</h3>
      <p>实时线上课堂，多人互动，提高学习体验并让学生获得更及时有效的反馈。</p>
    </div>

    <div class="card">
      <h3>🚀 未来技能培训</h3>
      <p>包括编程、设计、人工智能基础，让学生提前接触科技，适应未来趋势。</p>
    </div>
  </div>

  <footer>
    © 2025 未来教育中心 | 提升学习，从今天开始
  </footer>
</body>
</html>
